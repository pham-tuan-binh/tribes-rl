<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tribes-rl</title>
<meta name="description" content="An open-source Polytopia rebuilt for reinforcement learning. Watch self-play trained agents fight for domination, or play against them — everything runs in your browser.">
<meta property="og:title" content="tribes-rl">
<meta property="og:description" content="Watch RL agents conquer an open-source Polytopia, or play against them. The trained policy runs entirely in your browser.">
<meta property="og:image" content="https://pham-tuan-binh.github.io/tribes-rl/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script>/* apply a pinned theme before first paint (no flash) */
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='16' y='2' width='20' height='20' fill='%23d97706' transform='rotate(45 16 16)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@500;600&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- start the big downloads (engine + policy weights) with the page, not after
     JS boots. ONE module + ONE policy serve every player count. -->
<link rel="modulepreload" href="dist/poly.js">
<link rel="preload" href="dist/poly.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
<link rel="preload" href="weights/latest.bin" as="fetch" crossorigin="anonymous">
</head>
<body>
<div id="loader">
  <div class="loader-box">
    <div class="loader-head">
      <span id="loader-label">loading</span>
      <span id="loader-pct">0%</span>
    </div>
    <div class="loader-track"><div id="loader-fill"></div></div>
  </div>
</div>
<main>
  <div id="board-wrap">
    <canvas id="board" width="704" height="704" aria-label="game board"></canvas>
    <div id="banner" class="hidden"></div>
    <div id="tip" class="hidden"></div>
  </div>

  <aside id="panel">
    <header>
      <div class="hdr-left">
        <h1>tribes<span class="accent">-rl</span></h1>
        <a id="gh" href="https://github.com/pham-tuan-binh/tribes-rl" target="_blank" rel="noopener" aria-label="source on GitHub"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
      </div>
      <button id="theme" aria-label="toggle theme"></button>
    </header>

    <!-- what you play: mode + the actions that drive it -->
    <section class="group">
      <div class="sec">game</div>
      <div class="seg" id="mode-row" role="tablist">
        <button id="mode-agents" class="seg-btn active" role="tab" data-tip="Watch trained agents play each other.">agents</button>
        <button id="mode-human" class="seg-btn" role="tab" data-tip="You play seat 1 against the agents.">human</button>
      </div>
      <div class="row btns">
        <button id="new-game">new game</button>
        <button id="pause">pause</button>
        <button id="end-turn" class="primary hidden">end turn</button>
      </div>
    </section>

    <!-- how it runs: players, pace, viewpoint -->
    <section class="group" id="controls">
      <div class="sec">settings</div>
      <div class="row" id="players-row">
        <label data-tip="How many tribes are in the match. One model plays them all — switching is instant.">players</label>
        <div class="seg small" id="players-seg"></div>
      </div>
      <div class="row" id="speed-row">
        <label for="speed" data-tip="Actions per second when agents play. Max runs the game unthrottled.">speed</label>
        <input type="range" id="speed" min="0" max="100" value="35">
        <span id="speed-label" class="pill"></span>
      </div>
      <div class="row" id="temp-row">
        <label for="temp" data-tip="Sampling temperature. Low = the agent picks its best move (stronger). High = more varied, riskier play.">temp</label>
        <input type="range" id="temp" min="10" max="120" value="50">
        <span id="temp-label" class="pill"></span>
      </div>
      <div class="row" id="view-row">
        <label data-tip="Whose fog of war you see. Follow switches to the acting agent each turn; world reveals the whole map.">view</label>
        <div class="seg small" id="view-seg"></div>
      </div>
    </section>

    <!-- the game: turn, players, history -->
    <section class="group" id="game-state">
      <div class="sec">match</div>
      <div id="status"></div>
      <div id="players"></div>
      <div id="scoreboard" class="hidden"></div>
    </section>

    <div id="verbs" class="card hidden">
      <div class="sec">choose action</div>
      <div id="verb-buttons"></div>
    </div>

    <section class="group" id="log">
      <div class="sec">log</div>
      <div id="log-lines"></div>
    </section>

    <p id="hint"></p>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
