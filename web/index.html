<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polytopia-rl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="board-wrap">
    <canvas id="board" width="704" height="704"></canvas>
    <div id="banner" class="hidden"></div>
  </div>

  <aside id="panel">
    <header>
      <h1>polytopia<span class="accent">·rl</span></h1>
      <p class="tagline">agents learn to conquer</p>
    </header>

    <div class="seg" id="mode-row" role="tablist">
      <button id="mode-agents" class="seg-btn active" role="tab">⚡ Agents</button>
      <button id="mode-human" class="seg-btn" role="tab">✿ Human</button>
    </div>

    <div class="card" id="controls">
      <div class="row" id="speed-row">
        <label for="speed">speed</label>
        <input type="range" id="speed" min="0" max="100" value="35">
        <span id="speed-label" class="pill"></span>
      </div>
      <div class="row" id="view-row">
        <label>view</label>
        <div class="seg small" id="view-seg"></div>
      </div>
      <div class="row btns">
        <button id="new-game">new game</button>
        <button id="pause">pause</button>
        <button id="end-turn" class="primary">end turn ⏎</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="players"></div>

    <div id="verbs" class="card hidden">
      <h2>choose action</h2>
      <div id="verb-buttons"></div>
    </div>

    <p id="hint"></p>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
