[base]
env_name = polytopia

[selfplay]
enabled = 1
max_size = 500
swap_winrate = 0.6
min_games = 2048
snapshot_interval = 1_000_000_000
opp_timeout_steps = 4_000_000_000

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16
num_frozen_banks = 1
frozen_bank_pct = 0.1

[env]
# Tactical shaping, all small vs the ±1 terminal (cumulative ~±0.4/game):
# cities are the engine of domination (zero-sum transfer on capture)
reward_city = 0.05
# trades weighted by star cost of the unit killed (knight 8 >> warrior 2)
reward_kill = 0.01
# fog exploration: finding villages and the enemy capital
reward_explore = 0.001
# income growth: pays for real economy (incl. USEFUL roads via trade
# connections) — spam roads now cost stars with no payoff
reward_prod = 0.01
# generic Tribes-score shaping OFF: score pays for temples/parks/monuments,
# which is score-farming, not domination
shaping = 0
# stalling to the micro-step cap costs both sides half a loss
draw_penalty = 0.5
max_episode_steps = 16384
fog = 1
seed = 42

[policy]
hidden_size = 512
num_layers = 3
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 10_000_000_000
learning_rate = 0.000572786
anneal_lr = 1
min_lr_ratio = 0.086914
# longer effective horizon than chess: conquest is thousands of micro-steps out
gamma = 0.999
gae_lambda = 0.85
replay_ratio = 0.25
clip_coef = 0.557019
vf_coef = 4.37465
vf_clip_coef = 1.69524
max_grad_norm = 3.54293
ent_coef = 0.0984801
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
beta1 = 0.972205
beta2 = 0.9
eps = 8.51435e-11
minibatch_size = 32768
# longer BPTT segments: fog makes the recurrent memory load-bearing
horizon = 128
vtrace_rho_clip = 1.99404
vtrace_c_clip = 2.19484
prio_alpha = 1
prio_beta0 = 0.474524
torch_deterministic = 1
adam_beta1 = 0.963206
adam_beta2 = 0.99999
adam_eps = 5.09326e-08
update_epochs = 1
